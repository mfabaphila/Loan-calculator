<!DOCTYPE html>

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
      
        <div class="header">
            <div class="header-item">
                <img src="images/logo.PNG" alt="image of a calculator">
            </div>

            <div class="header-item">Services</div>
            <div class="header-item">Courses</div>
            <div class="header-item">Free Tools</div>
            <div class="header-item">Blog</div>
              <div class="header-item">About Us</div>
        </div>

        <h1>Loan Calculator</h1>
        <h3>How Much Can I afford to loan?</h3>

        <div class="main-section">
            <div class="Personal-details">

            <h2>Personal Details</h2>

            <div class="personal-item">
                <label>Name</label>
                <input id="name" type="text" placeholder="Enter your name">
            </div>

             <div class="personal-item">
                <label>Surname</label>
                <input type="text" placeholder="Enter your name">
            </div>

             <div class="personal-item">
                <label>Email</label>
                <input type="text" placeholder="Enter your name">
            </div>
           

            <div class="financial-details">

                <h2>Financial Details</h2>

                <div class="financial-item">
                    <label>Income</label>
                    <input id="income" type="text" placeholder="R">
                </div>

                 <div class="financial-item">
                    <label>Total Monthly Expenses</label>
                    <input id="monthlyExpenses" type="text" placeholder="R">
                </div>

                 <div class="financial-item">
                    <label>Total Active Debt</label>
                    <input id="totalDebt" type="text" placeholder="R">
                </div>
                 </div>
                  <button id="submitBtn">Submit</button>
            </div>
                    
            <div class="Results">
                <div class="results-item">

                <h2>Results</h2>
                <div class="results-item">
                    <label>Remaining Amount</label>
                    <input id="remainingAmount" type="text" placeholder="R">
                </div>

                 <div class="results-item">
                    <label>Remaining Percentage</label>
                    <input id="remainingPercentage" type="text" placeholder="%">
                </div>

                 <div class="results-item">
                    <label>Suggested Loan</label>
                    <input id="suggestedLoan" type="text" placeholder="R">
                </div>

                 <div class="results-item">
                    <label>Advice</label>
                    <h4 id="advice"></h4>
                </div>

            </div>

        </div>
        
        
        <script src="script.js" async defer>

           
            
        </script>
    </body>
</html>
